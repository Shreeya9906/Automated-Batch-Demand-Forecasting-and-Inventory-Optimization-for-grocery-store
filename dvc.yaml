stages:
  validate_sales:
    cmd: python -m pipeline.validate_sales
    deps:
      - data/historical/sales_data.csv
      - pipeline/validation.py
      - pipeline/feature_engineering.py
      - src/common.py
    outs:
      - reports/sales_validation_report.json
      - reports/sales_validation_report.md

  validate_inventory:
    cmd: python -m pipeline.validate_inventory
    deps:
      - data/inventory/supply_chain_dataset1.csv
      - pipeline/validation.py
      - src/common.py
    outs:
      - reports/inventory_validation_report.json
      - reports/inventory_validation_report.md

  preprocess_sales:
    cmd: python -m pipeline.preprocess_sales
    deps:
      - data/historical/sales_data.csv
      - pipeline/preprocess_sales.py
      - pipeline/feature_engineering.py
      - src/common.py
    outs:
      - data/processed/sales_processed.csv

  preprocess_inventory:
    cmd: python -m pipeline.preprocess_inventory
    deps:
      - data/inventory/supply_chain_dataset1.csv
      - pipeline/preprocess_inventory.py
      - pipeline/feature_engineering.py
      - src/common.py
    outs:
      - data/processed/inventory_processed.csv

  analyze_leakage:
    cmd: python -m pipeline.analyze_leakage
    deps:
      - data/historical/sales_data.csv
      - pipeline/analyze_leakage.py
      - pipeline/feature_engineering.py
      - src/common.py
    outs:
      - reports/leakage_analysis_report.json

  train_baseline_models:
    cmd: python -m pipeline.train_models --feature-mode baseline
    deps:
      - data/processed/sales_processed.csv
      - pipeline/train_models.py
      - pipeline/modeling.py
      - pipeline/feature_engineering.py
      - src/common.py
    outs:
      - models/linear_regression_baseline_v1.pkl
      - models/decision_tree_baseline_v1.pkl
      - models/random_forest_baseline_v1.pkl
      - reports/model_comparison_baseline.csv
      - reports/baseline_model_metrics.json

  train_safe_models:
    cmd: python -m pipeline.train_models --feature-mode safe
    deps:
      - data/processed/sales_processed.csv
      - pipeline/train_models.py
      - pipeline/modeling.py
      - pipeline/feature_engineering.py
      - src/common.py
    outs:
      - models/linear_regression_v1.pkl
      - models/decision_tree_v1.pkl
      - models/random_forest_v1.pkl
      - reports/model_comparison_safe_baseline.csv
      - reports/safe_model_metrics.json

  train_xgboost_safe:
    cmd: python -m pipeline.train_xgboost --feature-mode safe
    deps:
      - data/processed/sales_processed.csv
      - pipeline/train_xgboost.py
      - pipeline/modeling.py
      - pipeline/feature_engineering.py
      - src/common.py
    outs:
      - models/xgboost_v1.pkl
      - reports/safe_xgboost_metrics.json

  evaluate_models:
    cmd: python -m pipeline.evaluate_models
    deps:
      - reports/safe_model_metrics.json
      - reports/safe_xgboost_metrics.json
      - pipeline/evaluate_models.py
      - src/common.py
    outs:
      - data/processed/model_comparison.csv
      - data/processed/feature_importance.csv
      - reports/model_selection_summary.json

  generate_forecasts:
    cmd: python -m pipeline.generate_forecasts
    deps:
      - data/processed/sales_processed.csv
      - data/processed/model_comparison.csv
      - reports/model_selection_summary.json
      - pipeline/generate_forecasts.py
      - pipeline/modeling.py
      - src/common.py
    outs:
      - data/processed/forecast_output.csv

  create_mapping:
    cmd: python -m pipeline.create_mapping
    deps:
      - data/historical/sales_data.csv
      - data/inventory/supply_chain_dataset1.csv
      - pipeline/create_mapping.py
      - pipeline/mapping.py
      - src/common.py
    outs:
      - reports/location_mapping.csv
      - reports/product_mapping.csv
      - reports/mapping_summary.json

  integrate_datasets:
    cmd: python -m pipeline.integrate_datasets
    deps:
      - data/processed/forecast_output.csv
      - data/processed/inventory_processed.csv
      - data/historical/sales_data.csv
      - data/inventory/supply_chain_dataset1.csv
      - pipeline/integrate_datasets.py
      - pipeline/mapping.py
      - src/common.py
    outs:
      - reports/integrated_dataset.csv
      - data/processed/decision_dataset.csv
      - reports/integration_summary.json

  generate_synthetic_parameters:
    cmd: python -m pipeline.generate_synthetic_parameters
    deps:
      - data/inventory/supply_chain_dataset1.csv
      - pipeline/generate_synthetic_parameters.py
      - src/common.py
    outs:
      - data/synthetic/synthetic_inventory_parameters.csv

  optimize_inventory:
    cmd: python -m pipeline.optimize_inventory
    deps:
      - data/processed/decision_dataset.csv
      - data/synthetic/synthetic_inventory_parameters.csv
      - pipeline/optimize_inventory.py
      - src/optimization.py
      - src/common.py
    outs:
      - data/processed/inventory_optimization_result.csv
      - reports/inventory_optimization_summary.json
