name: Continuous Training

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-evaluate-promote:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Make DVC training data available
        shell: bash
        run: |
          if [ -z "$(dvc remote list)" ]; then
            echo "::error::No DVC remote is configured. CT cannot retrieve training data on a clean GitHub runner."
            exit 1
          fi
          dvc pull
          test -f data/processed/sales_processed.csv || {
            echo "::error::DVC training data is unavailable after dvc pull."
            exit 1
          }

      - name: Preserve production metric
        run: cp reports/safe_xgboost_metrics.json "$RUNNER_TEMP/production_xgboost_metrics.json"

      - name: Train candidate XGBoost model
        run: >-
          python -m pipeline.train_xgboost
          --feature-mode safe
          --model-output models/xgboost_candidate.pkl
          --metrics-output reports/candidate_xgboost_metrics.json

      - name: Evaluate candidate model
        run: |
          cp reports/candidate_xgboost_metrics.json reports/safe_xgboost_metrics.json
          python -m pipeline.evaluate_models

      - name: Apply quality gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          candidate = json.loads(Path("reports/candidate_xgboost_metrics.json").read_text())["xgboost"]
          production = json.loads(
              Path(os.environ["RUNNER_TEMP"], "production_xgboost_metrics.json").read_text()
          )["xgboost"]

          candidate_is_not_worse = (
              candidate["R2"] > production["R2"]
              or (
                  candidate["R2"] == production["R2"]
                  and candidate["MAE"] <= production["MAE"]
              )
          )
          print(f"Production R2={production['R2']}, MAE={production['MAE']}")
          print(f"Candidate R2={candidate['R2']}, MAE={candidate['MAE']}")
          if not candidate_is_not_worse:
              raise SystemExit("Quality gate failed: candidate is worse than production.")
          PY

      - name: Promote candidate model
        run: cp models/xgboost_candidate.pkl models/xgboost_v1.pkl